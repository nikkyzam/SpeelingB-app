<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="spineGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="10" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book with shadow -->
  <g filter="url(#shadow1)">
    <!-- Book spine -->
    <rect x="50" y="50" width="30" height="460" fill="url(#spineGrad1)" rx="5"/>

    <!-- Book cover -->
    <rect x="80" y="50" width="290" height="460" fill="url(#coverGrad1)" rx="10"/>
  </g>

  <!-- Decorative pattern -->
  <g opacity="0.2">
    <circle cx="120" cy="120" r="25" fill="white"/>
    <circle cx="280" cy="380" r="30" fill="white"/>
    <circle cx="200" cy="200" r="15" fill="white"/>
  </g>

  <!-- Icon based on book type -->
  <g transform="translate(225, 220)" fill="white" opacity="0.9">
    <!-- Bible icon -->
    <rect x="-30" y="-40" width="60" height="80" rx="5" stroke="white" stroke-width="3" fill="none"/>
    <line x1="-15" y1="-30" x2="15" y2="-30" stroke="white" stroke-width="2"/>
    <line x1="-15" y1="-20" x2="15" y2="-20" stroke="white" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="225" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    Beginner's Bible
  </text>

  <!-- For Kids -->
  <text x="225" y="360" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.9">
    Christian Values
  </text>

  <!-- Sparkle effects -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="3" fill="white"/>
    <circle cx="350" cy="150" r="4" fill="white"/>
    <circle cx="300" cy="400" r="2" fill="white"/>
    <circle cx="150" cy="350" r="3" fill="white"/>
  </g>
</svg>
