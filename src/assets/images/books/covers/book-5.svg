<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <linearGradient id="spineGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="10" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book with shadow -->
  <g filter="url(#shadow5)">
    <!-- Book spine -->
    <rect x="50" y="50" width="30" height="460" fill="url(#spineGrad5)" rx="5"/>

    <!-- Book cover -->
    <rect x="80" y="50" width="290" height="460" fill="url(#coverGrad5)" rx="10"/>
  </g>

  <!-- Decorative pattern -->
  <g opacity="0.2">
    <circle cx="120" cy="120" r="25" fill="white"/>
    <circle cx="280" cy="380" r="30" fill="white"/>
    <circle cx="200" cy="200" r="15" fill="white"/>
  </g>

  <!-- Icon based on book type -->
  <g transform="translate(225, 220)" fill="white" opacity="0.9">
    <!-- Child/smile icon -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="-15" cy="-10" r="5" fill="white"/>
    <circle cx="15" cy="-10" r="5" fill="white"/>
    <path d="M -20,15 Q 0,25 20,15" stroke="white" stroke-width="3" fill="none"/>
  </g>

  <!-- Title -->
  <text x="225" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    God Made Me
  </text>

  <!-- For Kids -->
  <text x="225" y="360" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.9">
    Christian Values
  </text>

  <!-- Sparkle effects -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="3" fill="white"/>
    <circle cx="350" cy="150" r="4" fill="white"/>
    <circle cx="300" cy="400" r="2" fill="white"/>
    <circle cx="150" cy="350" r="3" fill="white"/>
  </g>
</svg>
